name: Gitflow Debug APK Build

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Test & Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK (API 35)
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          validate-wrappers: false

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify Debug APK Output
        id: apk_info
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Debug APK not found at $APK_PATH"
            exit 1
          fi
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChargePulse-debug-apk-${{ github.run_number }}
          path: ${{ steps.apk_info.outputs.apk_path }}
          retention-days: 30

      - name: Write Build Summary
        run: |
          {
            echo "## ChargePulse Debug APK Build"
            echo ""
            echo "| Field | Value |"
            echo "| :--- | :--- |"
            echo "| **Branch / Ref** | \`${{ github.ref_name }}\` |"
            echo "| **Commit** | \`${{ github.sha }}\` |"
            echo "| **APK File** | \`app-debug.apk\` |"
            echo "| **APK Size** | \`${{ steps.apk_info.outputs.apk_size }}\` |"
            echo "| **Artifact** | \`ChargePulse-debug-apk-${{ github.run_number }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
